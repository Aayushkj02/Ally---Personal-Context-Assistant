plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ally.nativemodule'
version = '0.1.0'

android {
  namespace "com.ally.nativemodule"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JVM unit tests for the emergency rule — no device, no ContentResolver.
  testImplementation 'junit:junit:4.13.2'
}
